# devices/starlte/device.conf: the Samsung Galaxy S9 (SM-G960F, Exynos 9810). Kept in the common tree for now (devices/manifest.conf);
# README.md here has the port's state, the hardware's facts and where each came from, and how it is started.

device starlte
	title       Galaxy S9
	vendor      Samsung
	soc         exynos9810
	defconfig   starlte_defconfig
	maintainer  Scion (README.md)
	status      display     partial   the panel through UEFI's framebuffer (1440 x 2960 at 0xCC000000): written, not yet seen on the phone
	status      cpu         partial   the four Cortex-A55s (cpus=4); the M3 cluster is left off: written, not yet seen on the phone
	status      touch       missing   Samsung S6SY761 on HSI2C: no driver yet
	status      buttons     missing   GPIO keys (Silicium's KeypadDeviceLib has the pins): no driver yet
	status      storage     missing   Exynos UFS: no driver yet; the root is a RAM disk
	status      gpu         missing   Mali-G72 MP18: no driver
	status      audio       missing
	status      battery     missing
	status      wifi        missing   BCM4361 on PCIe
	status      cellular    missing
