# iOS 16.5 (AVF): HakiOS's XNU under crosvm. avfboot (Image) loads the payload: the kernel and
# root.apfs (the small image, /dev/md1). system.apfs (iOS 16.5, 2.5 GB) is a read-only virtio
# disk that the kernel names md0 (md0=rvblk0), the root, as on HakiOS's QEMU and phone setups.
# Add -v to params for the verbose console (launchd then logs every notice to it, which costs
# CPU: SpringBoard's failed lookups alone are hundreds of lines a minute); avfboot adds
# console_quiet=1 unless params say console_quiet=0.
# cpus=8 in params with cpus=host: one vCPU per host core, the big cores first (avfboot), with the
# machine timeouts scaled for a guest (avfboot, timeout_scale=).
kernel=Image
initrd=payload.bin
disk.0=system.apfs
# gl=1: CoreAnimation draws through OpenGL ES on the phone's GPU (userland/src/eagl.c over gfx,
# gfxstream through /dev/vgpu3d), which needs gpu=gfxstream below. Without gl=1 it draws in
# software.
# virtio_net_wifi=1: with Scion's "Network" setting on, AVF adds a virtio-net card (Android's VM
# tethering behind it) and iOS sees it as Wi-Fi, joined to the open network "Scion"
# (bsd/dev/hakios.virtio_net.c). Without the setting there is no card and it does nothing.
params=md0=rvblk0 cpus=8 gl=1 virtio_net_wifi=1
memory_mib=4096
cpus=host
# a virtio-gpu drawn by the phone's GPU (crosvm --gpu, gfxstream backend, gfxstream-gles context)
gpu=gfxstream
