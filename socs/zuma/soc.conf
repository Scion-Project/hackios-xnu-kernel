# socs/zuma/soc.conf: the facts of a Google Tensor G3 (zuma), compile-tested at most: it has never booted. docs/soc-support.md.

soc zuma
	title       Google Tensor G3 (zuma)
	vendor      Google
	cores       9: four Cortex-A510, four Cortex-A715, one Cortex-X3
	gpu         Mali-G715 MP7 (Valhall v11, CSF)
	maintainer  Scion (none: no phone)
	source      B android.googlesource.com/kernel/devices/google/zuma@42395e8adcb8 dts/zuma.dtsi, zuma-ufs.dtsi, zuma-gpu.dtsi, zuma-drm-dpu.dtsi, zuma-usb.dtsi, zuma-mfc.dtsi
	source      L linux@05441d697f7f the gs101 drivers, the family only: mainline has no such SoC
	block       cpu   code      L  no UEFI, no S-Boot: ABL, as socs/lga has; A55s or A510s boot; three cluster types
	block       acpm  code      L  initdata 0xA000; Google's ACPM differs from Samsung's fvmap
	block       gic   table     L  GICv3: the driver XNU already has
	block       timer table     L  architected; CNTFRQ from the firmware
	block       uart  table     L  google,gs101-uart
	block       ufs   code      B  Inferred from gs101: ABL powers UFS down, so a cold re-init with PHY tables
	block       usb   code      L  google,gs101-usb31drd-phy
	block       dpu   different B  Google DRM DPU, not fbdev DECON
	block       gpu   different B  CSF: firmware loaded and scheduled; Linux panthor, Mesa v11, not the job manager interface we drive
	block       mfc   code      B  BigOcean or MFC, firmware
	block       usi   code      L  USI v2: a control register at the block's +0xC0
	block       pmic  different L  S2MPG over ACPM
	block       wdt   table     L  google,gs101-wdt
