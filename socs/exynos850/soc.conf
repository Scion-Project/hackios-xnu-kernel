# socs/exynos850/soc.conf: the facts of a Samsung Exynos 850 (S5E3830), compile-tested at most: it has never booted. docs/soc-support.md.

soc exynos850
	title       Samsung Exynos 850 (S5E3830)
	vendor      Samsung
	cores       8: eight Cortex-A55
	gpu         Mali-G52 r1 (Bifrost, job manager)
	maintainer  Scion (none: no phone)
	source      L linux@05441d697f7f arch/arm64/boot/dts/exynos/exynos850.dtsi
	block       cpu   code      L  all A55s, 8.2, two clusters; no DVFS tables
	block       acpm  unknown   L  mailbox and SRAM known; IPC and initdata not established
	block       gic   table     L  GIC-400
	block       timer table     L  architected
	block       uart  table     L  samsung,exynos850-uart
	block       ufs   different L  no UFS: eMMC (DW MMC), for which there is no driver
	block       usb   code      L  samsung,exynos850-usbdrd-phy
	block       dpu   unknown   -  no display node in mainline; no BSP read
	block       gpu   code      L  Panfrost and Mesa know G52; no power sequence
	block       mfc   unknown   -  no node in mainline
	block       usi   code      L  USI v2: a control register at the block's +0xC0
	block       pmic  unknown   -  not established from these sources
	block       wdt   table     L  samsung,exynos850-wdt
