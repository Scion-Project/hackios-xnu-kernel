# socs/exynos2100/soc.conf: the facts of a Samsung Exynos 2100 (S5E9840), compile-tested at most: it has never booted. docs/soc-support.md.

soc exynos2100
	title       Samsung Exynos 2100 (S5E9840)
	vendor      Samsung
	cores       8: four Cortex-A55, three Cortex-A78, one Cortex-X1 (vendor sheet)
	gpu         Mali-G78 MP14 (Valhall v9, job manager)
	maintainer  Scion (none: no phone)
	source      B GoRhanHee/android_kernel_samsung_exynos2100_o1s@5fdc9b765eb3 arch/arm64/boot/dts/exynos/exynos2100.dts
	source      D same tree, drivers/video/fbdev/exynos/dpu30/cal_2100/regs-decon.h
	block       cpu   code      B  A55s boot; A78 and X1 a third cluster type; DVFS tables absent
	block       acpm  table     B  9810 SRAM place; PMIC through other transports not looked at
	block       gic   table     B  GICv3: the driver XNU already has
	block       timer table     B  architected
	block       uart  table     B  Samsung UART
	block       ufs   table     B  taken as UEFI left it; coherency word not found in the tree
	block       usb   code      B  PHY moved, CAL differs
	block       dpu   different D  5 of 71 DECON registers named the same: a new register map
	block       gpu   code      B  no G78 id in Linux panfrost or Mesa's model table
	block       mfc   code      B  two MFC cores, firmware
	block       usi   table     B  same USI
	block       pmic  unknown   -  not established from these sources
	block       wdt   table     B  samsung,exynos2100-*-wdt
