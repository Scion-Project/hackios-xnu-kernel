# socs/exynos9820/soc.conf: the facts of a Samsung Exynos 9820 (S5E9820), compile-tested at most: it has never booted. docs/soc-support.md.

soc exynos9820
	title       Samsung Exynos 9820 (S5E9820)
	vendor      Samsung
	cores       8: four Cortex-A55, two Cortex-A75, two Exynos M4
	gpu         Mali-G76 MP12 (Bifrost, job manager)
	maintainer  Scion (none: no phone)
	source      B LineageOS/android_kernel_samsung_exynos9820@a412cfaf86b9 arch/arm64/boot/dts/exynos/exynos9820.dts
	source      M same tree, exynos9820-mali_common.dtsi and exynos9820-mfc.dtsi
	source      D same tree, drivers/video/fbdev/exynos/dpu20/cal_9820/regs-decon.h
	block       cpu   code      B  A55s boot as on the 9810; M4 and A75 are 8.2 but a third cluster type; no DVFS tables
	block       acpm  table     B  9810 SRAM and shape; fvmap_offset given
	block       gic   table     B  GIC-400
	block       timer table     B  architected, 26 MHz
	block       uart  table     B  Samsung UART
	block       ufs   table     B  taken as UEFI left it; PMU word for the PHY not found in the tree
	block       usb   code      B  PHY blocks moved, CAL differs
	block       dpu   table     D  71 of 71 DECON registers named the same, 70 same value, the other a mask the driver does not use; DPP and IDMA not compared
	block       gpu   code      M  Panfrost and Mesa know G76; rail, PLL and PMU sequence are the 9810's
	block       mfc   code      M  firmware, PMU, CMU
	block       usi   table     B  same USI
	block       pmic  unknown   -  not established from these sources
	block       wdt   table     B  two cluster watchdogs
