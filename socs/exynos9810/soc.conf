# socs/exynos9810/soc.conf: the facts of a Samsung Exynos 9810, whatever phone it is in (Galaxy S9, S9+, Note9).
# A phone with this SoC includes configs/exynos9810.config from its defconfig. docs/porting/repositories.md has every word.

soc exynos9810
	title       Samsung Exynos 9810 (S5E9810)
	vendor      Samsung
	cores       8: four Cortex-A55 (0-3, MPIDR 0x000-0x003) and four Exynos M3 (4-7, MPIDR 0x100-0x103)
	gpu         Mali-G72 MP18
	maintainer  Scion (devices/starlte/README.md)
	source      L linux@05441d697f7f arch/arm64/boot/dts/exynos/exynos9810.dtsi
	source      B LineageOS/android_kernel_samsung_universal9810@5a2dd7d6f3a0 and Silicium's starlte.dts; each driver names its place
	block       cpu   runs      B  all eight cores (cpus=8 m3_prep=3), partly: docs/devices/starlte.md
	block       acpm  runs      B  the PMIC's registers and DVFS through ACPM
	block       gic   runs      L  GIC-400
	block       timer runs      L  architected, 26 MHz
	block       uart  table     L  no console driver of ours; UART_BT is the Bluetooth driver's
	block       ufs   runs      B  the kernel's own UFS driver
	block       usb   runs      B  the port as a USB serial device
	block       dpu   runs      B  frames flipped at DECON's refresh
	block       gpu   runs      B  Mali-G72 with HakiosMali for Mesa's panfrost, partly
	block       mfc   runs      B  partly: docs/devices/starlte.md
	block       usi   runs      B  touch and battery on HSI2C, the codec on SPI
	block       pmic  runs      B  S2MPS18 through ACPM
	block       wdt   runs      B  the loader's boot watchdog
