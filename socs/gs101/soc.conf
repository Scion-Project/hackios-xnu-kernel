# socs/gs101/soc.conf: the facts of a Google Tensor G1 (gs101), compile-tested at most: it has never booted. docs/soc-support.md.

soc gs101
	title       Google Tensor G1 (gs101)
	vendor      Google
	cores       8: four Cortex-A55, two Cortex-A76, two Cortex-X1
	gpu         Mali-G78 MP20 (Valhall v9, job manager)
	maintainer  Scion (none: no phone)
	source      L linux@05441d697f7f arch/arm64/boot/dts/exynos/google/gs101.dtsi
	source      B android.googlesource.com/kernel/gs@af03195582e9 arch/arm64/boot/dts/google/gs101.dtsi, gs101-ufs.dtsi, gs101-gpu.dtsi, gs101-drm-dpu.dtsi, gs101-mfc.dtsi
	source      P PixOS-Project/pixelios-kernel@04457e5ddae2 (MIT) soc/google/gs101/soc.json, docs/research/27 and 32, soc/google/gs101/docs/08
	block       cpu   code      P  eight cores seen under XNU on a Pixel 6a by PixOS, through ABL and a fastboot boot shim, with its own patches; none of it here
	block       acpm  code      P  another mailbox layout: INTGR1 0x40, INTCR0 0x24, INTSR0 0x2C; fvmap at +0x31000
	block       gic   table     L  GICv3: the driver XNU already has
	block       timer table     P  architected, 24.576 MHz
	block       uart  table     L  google,gs101-uart, 0x10A00000
	block       ufs   code      P  ABL powers the device down: cold re-init with PHY tables, then HS-G4, seen by PixOS
	block       usb   code      P  DWC_usb31 at 0x11110000, seen as a gadget by PixOS; another PHY
	block       dpu   different B  Google DRM DPU, not fbdev DECON; the boot framebuffer is inherited by PixOS
	block       gpu   code      P  job manager, as our driver; GPU_ID 0x92020010: no row in Linux panfrost or Mesa; ABL leaves it powered; rail on S2MPG11; hakios.mali.c refuses all but 0x6221
	block       mfc   code      B  MFC, firmware
	block       usi   code      P  USI v2: a control register at the block's +0xC0
	block       pmic  different P  S2MPG10 and S2MPG11 over ACPM
	block       wdt   table     P  two; ABL arms them
