# socs/exynos8895/soc.conf: the facts of a Samsung Exynos 8895 (S5E8895), compile-tested at most: it has never booted. docs/soc-support.md.

soc exynos8895
	title       Samsung Exynos 8895 (S5E8895)
	vendor      Samsung
	cores       8: four Cortex-A53 and four Exynos M2
	gpu         Mali-G71 MP20 (Bifrost, job manager)
	maintainer  Scion (none: no phone)
	source      L linux@05441d697f7f arch/arm64/boot/dts/exynos/exynos8895.dtsi
	source      B acroreiser/android_kernel_samsung_universal8895@0288020e9751 arch/arm64/boot/dts/exynos/exynos8895.dtsi
	source      D same tree, drivers/video/fbdev/exynos/dpu/regs-decon.h
	block       cpu   different B  A53 and M2 are ARMv8.0; the kernel keeps to cores with the A11's 8.2 (socs/exynos9810/configs/exynos9810.config)
	block       acpm  table     B  same IPC shape, no fvmap in the tree
	block       gic   table     L  GIC-400, as the 9810
	block       timer table     L  architected, 26 MHz
	block       uart  table     L  Samsung UART; no driver of ours uses a console UART
	block       ufs   table     B  same addresses as the 9810 but the PMU; taken as UEFI left it
	block       usb   code      B  PHY at another place with a different CAL
	block       dpu   code      D  37 of 71 DECON registers same name and value as the 9810
	block       gpu   code      B  Panfrost and Mesa know G71; rail, PLL and PMU sequence are the 9810's
	block       mfc   code      B  samsung,mfc-v6; firmware
	block       usi   table     L  same USI, mainline has HSI2C and SPI nodes
	block       pmic  unknown   -  not established from these sources
	block       wdt   table     B  samsung,exynos8-wdt
