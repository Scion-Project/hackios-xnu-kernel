# socs/exynos990/soc.conf: the facts of a Samsung Exynos 990 (S5E9830), compile-tested at most: it has never booted. docs/soc-support.md.

soc exynos990
	title       Samsung Exynos 990 (S5E9830)
	vendor      Samsung
	cores       8: four Cortex-A55, two Cortex-A76, two Exynos M5
	gpu         Mali-G77 MP11 (Valhall v9, job manager)
	maintainer  Scion (none: no phone)
	source      L linux@05441d697f7f arch/arm64/boot/dts/exynos/exynos990.dtsi
	source      B GoRhanHee/android_kernel_samsung_exynos990_x1s@458e649f59c3 arch/arm64/boot/dts/exynos/exynos9830.dts
	source      D same tree, drivers/video/fbdev/exynos/dpu30/cal_9830/regs-decon.h
	block       cpu   code      L  A55s boot; M5, A76 a third cluster type; DVFS tables absent
	block       acpm  table     B  9810 shape, larger SRAM
	block       gic   table     L  GIC-400
	block       timer table     L  architected, 26 MHz
	block       uart  table     B  Samsung UART
	block       ufs   table     B  taken as UEFI left it; PMU word for the PHY not found in the tree
	block       usb   code      L  PHY moved; mainline has samsung,exynos990-usbdrd-phy
	block       dpu   table     D  70 of 71 DECON registers named the same, 69 same value, the other a mask the driver does not use; DPP and IDMA not compared
	block       gpu   code      B  no G77 id in Linux panfrost or Mesa's model table
	block       mfc   code      B  firmware, PMU, CMU
	block       usi   table     B  same USI
	block       pmic  unknown   -  not established from these sources
	block       wdt   table     L  samsung,exynos990-wdt
